name: PR hygiene

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read
  contents: read

jobs:
  validate:
    name: VÃ©rification des rÃ¨gles de branches
    runs-on: ubuntu-latest

    steps:
      - name: VÃ©rifier la branche source et la destination
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr.head.ref;
            const base = pr.base.ref;
            const body = pr.body || "";

            if (base === "main" && head !== "dev") {
              core.setFailed(
                "La branche main ne peut recevoir une PR que depuis dev."
              );
              return;
            }

            if (base === "dev" && !head.startsWith("feature/") && head !== "dev") {
              core.setFailed(
                "Une PR vers dev doit provenir d'une branche feature/Mx."
              );
              return;
            }

            if (base === "main" && head === "dev") {
              core.info("PR dev -> main autorisÃ©e.");
            }

            if (base === "dev" && head.startsWith("feature/")) {
              core.info("PR feature -> dev autorisÃ©e.");
            }

            if (!/(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body)) {
              core.setFailed(
                "La description de la PR doit contenir Closes #N."
              );
            }